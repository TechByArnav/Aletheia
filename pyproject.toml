[project]
name = "aletheia"
version = "0.1.0"
description = "Aletheia — Common Data Set discovery, extraction, and comparison pipeline (C7, C8-C11)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "pypdf>=4.0",
]
[project.optional-dependencies]
pdf = ["pymupdf>=1.23", "pdfplumber>=0.10"]
test = ["pytest>=8.0"]
[project.scripts]
aletheia = "aletheia.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["aletheia*"]
